apiVersion: v1
kind: ConfigMap
metadata:
  name: push-receiver-script
  namespace: mvd
data:
  server.py: |
    """
    Tiny HTTP receiver for EDC HttpData-PUSH transfers.
    POST any path -> body saved to /tmp/last.bin and appended to /tmp/log.txt
    GET /last     -> last received body
    GET /log      -> append-only log of what arrived (one line summary each)
    """
    import json
    import os
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    LAST = "/tmp/last.bin"
    LOG = "/tmp/log.txt"

    class H(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print("[recv]", fmt % args, flush=True)

        def do_POST(self):
            te = self.headers.get("transfer-encoding", "").lower()
            if "chunked" in te:
                body = b""
                while True:
                    sz_line = self.rfile.readline().strip()
                    try:
                        sz = int(sz_line, 16)
                    except ValueError:
                        break
                    if sz == 0:
                        self.rfile.readline()
                        break
                    body += self.rfile.read(sz)
                    self.rfile.readline()
            else:
                n = int(self.headers.get("content-length", 0))
                body = self.rfile.read(n) if n else b""
            with open(LAST, "wb") as f:
                f.write(body)
            ts = time.strftime("%Y-%m-%dT%H:%M:%S")
            summary = f"{ts} {self.command} {self.path} bytes={len(body)} ct={self.headers.get('content-type', '?')}\n"
            with open(LOG, "a") as f:
                f.write(summary)
            print(summary.strip(), flush=True)
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps({"ok": True, "received_bytes": len(body)}).encode())

        def do_GET(self):
            if self.path.endswith("/last"):
                try:
                    with open(LAST, "rb") as f:
                        data = f.read()
                except FileNotFoundError:
                    data = b'(no data yet)'
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(data)
            elif self.path.endswith("/log"):
                try:
                    with open(LOG, "rb") as f:
                        data = f.read()
                except FileNotFoundError:
                    data = b'(empty log)'
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(data)
            else:
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'push-receiver up. POST any path to send data; GET /last or /log.')

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: push-receiver
  namespace: mvd
  labels:
    App: push-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      App: push-receiver
  template:
    metadata:
      labels:
        App: push-receiver
    spec:
      containers:
        - name: server
          image: python:3.11-slim
          command: ["python3", "/script/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /script
      volumes:
        - name: script
          configMap:
            name: push-receiver-script
---
apiVersion: v1
kind: Service
metadata:
  name: push-receiver
  namespace: mvd
spec:
  selector:
    App: push-receiver
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: push-receiver-ingress
  namespace: mvd
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /push-receiver(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: push-receiver
                port:
                  number: 80
